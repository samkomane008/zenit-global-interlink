name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: website-build
    runs-on: ${{ fromJSON(vars.ZENIT_CI_RUNNERS || '["ubuntu-latest"]') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Test exact-SHA release eligibility offline
        run: |
          bash -n scripts/release-eligible.sh
          bash tests/test-release-eligible.sh
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Validate production build
        run: npm run build

  security:
    name: secret-scan
    runs-on: ${{ fromJSON(vars.ZENIT_CI_RUNNERS || '["ubuntu-latest"]') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan full history for exposed credentials
        run: |
          docker run --pull=always --rm -v "$PWD:/repo:ro" zricethezav/gitleaks:v8.30.1 \
            detect --source=/repo --redact --exit-code 1
