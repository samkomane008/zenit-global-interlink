name: Deploy to Cloudflare

# Never run production secrets on a pull_request or an unverified main SHA.
on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]

permissions:
  contents: read
  actions: read
  checks: read
  pull-requests: read

concurrency:
  group: zenit-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      ${{ vars.ZENIT_DEPLOY_ENABLED == 'true'
          && vars.ZENIT_DEPLOY_RUNNERS != ''
          && contains(fromJSON(vars.ZENIT_DEPLOY_RUNNERS || '[]'), 'self-hosted')
          && contains(fromJSON(vars.ZENIT_DEPLOY_RUNNERS || '[]'), 'zenit-deploy')
          && github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.event == 'push'
          && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ${{ fromJSON(vars.ZENIT_DEPLOY_RUNNERS || '["self-hosted","Linux","X64","zenit-deploy"]') }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Require merged exact-current-main build, secret scan and CI push
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          bash scripts/release-eligible.sh \
            --repo "$GITHUB_REPOSITORY" --sha "$SHA" \
            --workflow ci.yml --job website-build --job secret-scan

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build verified release
        env:
          VITE_WEB3FORMS_KEY: ${{ secrets.VITE_WEB3FORMS_KEY }}
        run: npm run build

      - name: Recheck main before publishing
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" == "$SHA" ]] ||
            { echo "::error::Main advanced; do not publish stale revision"; exit 1; }

      - name: Deploy verified site to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" ]] ||
            { echo "::error::Cloudflare credentials not configured"; exit 1; }
          npx --yes wrangler@4 deploy
