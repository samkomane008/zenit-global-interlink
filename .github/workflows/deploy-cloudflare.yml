# Deploy the exact main commit that passed the separate website CI workflow.
# No deploy from PRs, failed CI or a superseded commit.
name: Deploy to Cloudflare

on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: zenit-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.event == 'push'
          && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: zenit-production
      url: https://zenitglobal.co.za

    steps:
      - name: Refuse to deploy a superseded or unverified main commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          [[ "$SHA" =~ ^[a-f0-9]{40}$ ]] || exit 1
          main="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          [[ "$SHA" == "$main" ]] || { echo "::error::main has advanced; awaiting its own CI"; exit 1; }

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Require existing Cloudflare and client form configuration
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WEB3FORMS_KEY: ${{ secrets.VITE_WEB3FORMS_KEY }}
        run: |
          set -euo pipefail
          [[ -n "$CF_TOKEN" ]] || { echo "::error::Missing CLOUDFLARE_API_TOKEN secret"; exit 1; }
          [[ -n "$CF_ACCOUNT" ]] || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID variable"; exit 1; }
          [[ -n "$WEB3FORMS_KEY" ]] || { echo "::error::Missing client-approved VITE_WEB3FORMS_KEY secret"; exit 1; }

      - name: Install and build exact validated commit
        env:
          VITE_WEB3FORMS_KEY: ${{ secrets.VITE_WEB3FORMS_KEY }}
        run: |
          npm ci
          npm run build
          test -s dist/index.html

      - name: Reconfirm main before mutation
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" == "$SHA" ]] || {
            echo "::error::Main moved while release was building"; exit 1;
          }

      - name: Deploy static Cloudflare Workers assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy

      - name: Public HTTPS smoke check
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          curl --retry 5 --retry-delay 3 --fail --silent --show-error --max-time 20 \
            -o /dev/null https://zenitglobal.co.za/
          echo "::notice::Cloudflare deploy succeeded for $SHA."
